name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.0.3 numpy==1.24.3 duckdb==0.8.1 \
                      lifelines==0.29.0 scikit-learn==1.3.0 pytest==7.4.0

      - name: Run pytest
        run: pytest -v --tb=short

  manifest-drift:
    name: results/poc/manifest.json is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas numpy
      - name: Regenerate manifest from committed result CSVs
        run: python scripts/poc/build_manifest.py
      - name: Fail if the committed manifest has drifted
        run: |
          python - <<'PY'
          import json, subprocess, sys
          committed = json.loads(subprocess.check_output(
              ["git", "show", "HEAD:results/poc/manifest.json"]))
          with open("results/poc/manifest.json") as fh:
              regen = json.load(fh)
          for d in (committed, regen):
              d.pop("generated_at", None)
          if committed != regen:
              print("ERROR: results/poc/manifest.json is stale vs build_manifest.py",
                    file=sys.stderr)
              print("Re-run 'python scripts/poc/build_manifest.py' and commit.",
                    file=sys.stderr)
              sys.exit(1)
          print("OK: committed manifest reproduces from scripts/poc/build_manifest.py")
          PY

  snakemake-dry-run:
    name: snakemake --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install snakemake==7.32.4
      - name: Snakemake DAG dry-run
        run: snakemake --dry-run --printshellcmds || true

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check scripts tests --select E9,F63,F7,F82 --exit-zero
